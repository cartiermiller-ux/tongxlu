<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>数据已上报成功</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{min-height:100vh;padding:28px 18px;background:#f5f6f8;color:#222;
     font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.card{max-width:520px;margin:0 auto;background:#fff;border-radius:16px;
      padding:32px 22px 26px;box-shadow:0 2px 14px rgba(0,0,0,.06);text-align:center}
.icon{width:64px;height:64px;margin:0 auto 16px;border-radius:50%;background:#e8f8ef;
      display:flex;align-items:center;justify-content:center}
.icon svg{width:34px;height:34px;display:block}
h1{margin:0 0 10px;font-size:21px;font-weight:600;color:#0a8f4d;letter-spacing:.5px}
.desc{margin:0 0 6px;font-size:15px;color:#444}
.sub{margin:0;font-size:13.5px;color:#8b8f96}
.divider{height:1px;background:#eef0f2;margin:22px 0 18px}
.tips{margin:0;padding:0;list-style:none;text-align:left;font-size:13.5px;color:#7b8087}
.tips li{position:relative;padding:5px 0 5px 16px}
.tips li:before{content:"";position:absolute;left:2px;top:13px;width:5px;height:5px;
                border-radius:50%;background:#c9ced6}
.foot{margin:18px 0 0;font-size:12px;color:#b3b8bf;word-break:break-all}
@media (max-width:360px){body{padding:18px 12px}.card{padding:26px 16px 22px}h1{font-size:19px}}
</style>
</head>
<body>
<div class="card">
  <div class="icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="#0a8f4d" stroke-width="2.6"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 12.5l5.2 5.2L20 7"/>
    </svg>
  </div>
  <h1>数据已上报成功</h1>
  <p class="desc">您的数据已成功提交到服务器。</p>
  <p class="sub">请返回 App 内查看，感谢您的配合。</p>
  <div class="divider"></div>
  <ul class="tips">
    <li>上报已完成，无需在此页面做任何操作。</li>
    <li>可以直接关闭本页面，或返回 App。</li>
    <li>若数据未更新，请在 App 内重新进入本页。</li>
  </ul>
  <p class="foot">cartier.us.cc</p>
</div>
</body>
</html>
